<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Rounded Cocoa Brown Square -->
  <rect width="512" height="512" rx="128" fill="#4A3E3D"/>
  
  <defs>
    <!-- Premium Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDFB" />
      <stop offset="35%" stop-color="#F3E5D8" />
      <stop offset="70%" stop-color="#E8A598" />
      <stop offset="100%" stop-color="#DE8B7B" />
    </linearGradient>
  </defs>

  <!-- Stylized Geometric Letter 'S' -->
  <path 
    d="M 330 180 
       C 330 130, 290 120, 256 120 
       C 190 120, 190 190, 225 220 
       C 285 260, 320 260, 320 320 
       C 320 380, 280 392, 256 392 
       C 180 392, 180 330, 180 330" 
    fill="none" 
    stroke="url(#gold-grad)" 
    stroke-width="56" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
</svg>
