<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SGO Mobile Studio | ゼロベース執筆＆4大SNSマルチ展開</title>
  <meta name="description" content="鈴木啓悟の実筆オジ文体エッセイ・ビジネスコラムのゼロベース生成＆4大SNS（note, X, Instagram, Facebook）マルチ展開スタジオ">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #070d18;
      --card-bg: #0f172a;
      --card-inner: #080e1a;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-gradient: linear-gradient(135deg, #2563eb, #1d4ed8);
      --accent-cyan: #38bdf8;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding: 14px 12px 60px; min-height: 100vh; line-height: 1.5; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 2px 4px; }
    .header-left h1 { font-size: 1.25rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; }
    .header-left p { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .header-actions { display: flex; gap: 6px; }
    .btn-header { background: #1e293b; border: 1px solid var(--border); color: var(--text-muted); border-radius: 10px; padding: 7px 11px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-header.key-set { color: #38bdf8; border-color: rgba(56,189,248,0.3); }
    .btn-header.key-empty { background: #dc2626; color: #fff; border-color: #ef4444; }

    /* お題インスピレーションバー */
    .idea-bar { background: linear-gradient(135deg, rgba(37,99,235,0.15), rgba(16,185,129,0.15)); border-radius: 14px; padding: 10px 12px; border: 1px solid rgba(56,189,248,0.25); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .idea-bar-title { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; color: var(--accent-cyan); }
    .idea-bar-actions { display: flex; gap: 6px; }
    .btn-idea-random { background: #1e293b; border: 1px solid rgba(255,255,255,0.15); color: #e2e8f0; border-radius: 8px; padding: 6px 10px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .btn-idea-ai { background: linear-gradient(135deg, #2563eb, #10b981); border: none; color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 0.75rem; font-weight: 800; cursor: pointer; box-shadow: 0 2px 8px rgba(37,99,235,0.3); }

    .card { background: var(--card-bg); border-radius: 16px; padding: 14px; border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.35); margin-bottom: 14px; }
    .card-title { font-size: 0.82rem; font-weight: 700; color: var(--accent-cyan); display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }

    /* トーン選択グリッド */
    .tone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
    .tone-btn { background: #162032; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 10px 8px; text-align: left; cursor: pointer; transition: all 0.2s; }
    .tone-btn.active { background: var(--primary-gradient); border-color: #60a5fa; color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
    .tone-name { font-size: 0.8rem; font-weight: 700; color: #f1f5f9; }
    .tone-btn.active .tone-name { color: #fff; }
    .tone-desc { font-size: 0.66rem; color: #64748b; margin-top: 3px; line-height: 1.3; }
    .tone-btn.active .tone-desc { color: rgba(255,255,255,0.85); }

    /* 入力フォーム */
    .field-group { margin-bottom: 12px; }
    .field-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .field-label { font-size: 0.8rem; font-weight: 700; color: #f8fafc; }
    .field-count { font-size: 0.72rem; color: #64748b; }
    input[type="text"], textarea { width: 100%; background: var(--card-inner); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 12px; color: #fff; font-size: 0.92rem; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus, textarea:focus { border-color: var(--border-focus); }

    .error-card { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 10px; padding: 10px 12px; color: #fca5a5; font-size: 0.82rem; margin-bottom: 12px; line-height: 1.4; display: none; }

    .btn-generate { width: 100%; background: var(--primary-gradient); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 0.98rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 16px rgba(37,99,235,0.4); display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s, opacity 0.2s; }
    .btn-generate:active { transform: scale(0.98); }
    .btn-generate:disabled { background: #334155; opacity: 0.6; cursor: not-allowed; }

    /* 4大SNSタブ */
    .tab-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
    .tab-btn { flex: 1; min-width: 68px; padding: 9px 4px; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; background: #162032; color: var(--text-muted); font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: #60a5fa; }

    .result-box { width: 100%; height: 340px; background: var(--card-inner); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 14px; color: #f1f5f9; font-size: 0.9rem; line-height: 1.7; outline: none; resize: none; margin-bottom: 12px; }
    .result-box.sns-mode { height: 180px; }

    .action-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }
    .btn-action { padding: 13px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; text-align: center; }
    .btn-copy { background: linear-gradient(135deg, #10b981, #059669); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
    .btn-copy.copied { background: #059669; }
    .btn-open { background: #1e293b; color: #f8fafc; border: 1px solid rgba(255,255,255,0.1); }

    /* モーダル・ドロワー */
    .drawer-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); z-index: 900; display: none; justify-content: flex-end; backdrop-filter: blur(3px); }
    .drawer-overlay.open { display: flex; }
    .drawer-content { width: 100%; max-width: 420px; background: #0f172a; height: 100%; padding: 18px 14px; display: flex; flex-direction: column; border-left: 1px solid rgba(255,255,255,0.1); }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
    .modal-overlay.open { display: flex; }
    .modal-card { background: #0f172a; border-radius: 18px; padding: 20px; width: 100%; max-width: 440px; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 16px 36px rgba(0,0,0,0.6); max-height: 90vh; display: flex; flex-direction: column; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(16, 185, 129, 0.95); color: #fff; padding: 10px 22px; border-radius: 30px; font-size: 0.85rem; font-weight: 700; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 1100; box-shadow: 0 6px 20px rgba(0,0,0,0.5); backdrop-filter: blur(8px); }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div class="header-left">
      <h1>🚀 SGO Mobile Studio</h1>
      <p>ゼロベース執筆＆4大SNSマルチ展開スタジオ</p>
    </div>
    <div class="header-actions">
      <button id="historyBtn" class="btn-header" onclick="openHistory()">📚 履歴 (<span id="historyCount">0</span>)</button>
      <button id="keyBtn" class="btn-header key-empty" onclick="openKeyModal()">⚙️ 設定</button>
    </div>
  </header>

  <!-- お題インスピレーションバー -->
  <div class="idea-bar">
    <div class="idea-bar-title">
      <span>💡</span> お題に迷ったら？
    </div>
    <div class="idea-bar-actions">
      <button class="btn-idea-random" onclick="applyRandomPreset()">🎲 ランダム</button>
      <button class="btn-idea-ai" onclick="suggestIdeasWithAI()">✨ AIでお題提案</button>
    </div>
  </div>

  <!-- トーン選択カード -->
  <div class="card">
    <div class="card-title">🎭 執筆トーンを選択</div>
    <div class="tone-grid">
      <button class="tone-btn active" onclick="selectTone('oji', this)">
        <div class="tone-name">✍️ オジ文体 (原本再現)</div>
        <div class="tone-desc">自虐・自己ツッコミ()・肌感から実体経済/格差着地・熟睡したいぜ</div>
      </button>
      <button class="tone-btn" onclick="selectTone('business', this)">
        <div class="tone-name">💼 硬派ビジネス・知見</div>
        <div class="tone-desc">25年の経営知見・現場の泥臭さ・構造的アプローチ</div>
      </button>
      <button class="tone-btn" onclick="selectTone('sharp', this)">
        <div class="tone-name">⚡ 鋭い辛口・本音</div>
        <div class="tone-desc">世間の建前や欺瞞、構造の歪みをズバッと突く切れ味</div>
      </button>
      <button class="tone-btn" onclick="selectTone('story', this)">
        <div class="tone-name">🌿 現場録・人間ドラマ</div>
        <div class="tone-desc">汗と泥臭い情熱、人間味あふれる共感エッセイ</div>
      </button>
    </div>
  </div>

  <!-- 入力フォーム -->
  <div class="card">
    <div class="field-group">
      <div class="field-header">
        <label class="field-label">💡 noteのお題・テーマ <span style="color: #ef4444;">*</span></label>
        <span id="topicCount" class="field-count">0 文字</span>
      </div>
      <input type="text" id="topicInput" placeholder="例: 下請け構造と物価高のシワ寄せ、Z世代と昭和の職人気質" oninput="updateCounts()">
    </div>

    <div class="field-group">
      <div class="field-header">
        <label class="field-label" style="color: #94a3b8;">✍️ 着眼点・現場メモ・入れたい本音 (任意)</label>
        <span id="detailsCount" class="field-count">0 文字</span>
      </div>
      <textarea id="detailsInput" rows="3" placeholder="例: 先週の現場点検での会話。値上げできない零細の辛さ。最後は前向きに。「熟睡したい」を入れて。" oninput="updateCounts()"></textarea>
    </div>

    <div id="errorCard" class="error-card"></div>

    <button id="generateBtn" class="btn-generate" onclick="generateContent()">
      <span id="btnIcon">⚡</span>
      <span id="btnText">完全ゼロベース執筆を開始</span>
    </button>
  </div>

  <!-- 生成結果エリア -->
  <div id="resultCard" class="card" style="display: none;">
    <!-- 4大SNSタブ -->
    <div class="tab-bar">
      <button id="tabBtnNote" class="tab-btn active" onclick="switchTab('note', this)">📝 note (<span id="noteCharBadge">0</span>字)</button>
      <button id="tabBtnX" class="tab-btn" onclick="switchTab('x', this)">🐦 X (<span id="xCharBadge">0</span>字)</button>
      <button id="tabBtnInsta" class="tab-btn" onclick="switchTab('instagram', this)">📸 Instagram</button>
      <button id="tabBtnFb" class="tab-btn" onclick="switchTab('facebook', this)">👥 Facebook</button>
    </div>

    <textarea id="resultText" class="result-box" oninput="handleTextChange()"></textarea>

    <div class="action-grid">
      <button id="copyBtn" class="btn-action btn-copy" onclick="copyCurrentTab()">
        <span>📋 本文をコピー</span>
      </button>
      <a id="openAppBtn" class="btn-action btn-open" href="https://note.com" target="_blank" rel="noopener">
        <span>🚀 NOTEを開く</span>
      </a>
    </div>
  </div>

  <!-- お題提案モーダル -->
  <div id="ideasModal" class="modal-overlay">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
        <div style="font-size: 1rem; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 6px;">
          <span>✨</span> AIが厳選したお題候補
        </div>
        <button onclick="closeIdeasModal()" style="background: transparent; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>

      <div id="ideasList" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;"></div>

      <div style="margin-top: 12px; display: flex; gap: 8px;">
        <button id="refreshIdeaBtn" onclick="suggestIdeasWithAI()" style="flex: 1; background: #1e293b; color: #38bdf8; border: 1px solid rgba(56,189,248,0.3); border-radius: 10px; padding: 10px; font-size: 0.8rem; font-weight: 700; cursor: pointer;">🔄 別のお題を出す</button>
        <button onclick="closeIdeasModal()" style="background: #334155; color: #f8fafc; border: none; border-radius: 10px; padding: 10px 18px; font-size: 0.8rem; font-weight: 700; cursor: pointer;">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 履歴ドロワー -->
  <div id="historyDrawer" class="drawer-overlay" onclick="closeHistory()">
    <div class="drawer-content" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">
        <h2 style="font-size: 1.1rem; font-weight: 800; color: #f8fafc;">📚 執筆履歴</h2>
        <button onclick="closeHistory()" style="background: transparent; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>
      <div id="historyList" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
  </div>

  <!-- APIキーモーダル -->
  <div id="keyModal" class="modal-overlay">
    <div class="modal-card">
      <h2 style="font-size: 1.1rem; font-weight: 800; color: #f8fafc; margin-bottom: 8px;">🔑 Google Gemini API キー設定</h2>
      <p style="font-size: 0.8rem; color: #94a3b8; line-height: 1.5; margin-bottom: 14px;">
        外出先（スマホLTE/5G）から直接AIを呼び出すため、APIキーを設定してください。キーは端末（ブラウザ）内のみに安全に保存されます。
      </p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." style="margin-bottom: 12px;">
      <div style="font-size: 0.75rem; color: #38bdf8; margin-bottom: 16px;">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" style="color: #38bdf8; text-decoration: underline;">
          👉 Google AI Studio で無料APIキーを取得する（無料枠あり）
        </a>
      </div>
      <div style="display: flex; gap: 10px;">
        <button onclick="closeKeyModal()" style="flex: 1; background: #1e293b; color: #cbd5e1; border: none; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer;">キャンセル</button>
        <button onclick="saveApiKey()" style="flex: 1; background: var(--primary-gradient); color: #fff; border: none; border-radius: 10px; padding: 12px; font-weight: 800; cursor: pointer;">保存して適用</button>
      </div>
    </div>
  </div>

  <!-- トースト -->
  <div id="toast" class="toast">クリップボードにコピーしました！</div>

  <script>
    const PRESET_IDEAS = [
      { cat: "💴 実体経済・格差", topic: "物価高と下請け構造のシワ寄せ", memo: "値上げ要請が通らない現場の悲鳴。大手と零細の体力差。最後は泥臭い知恵と覚悟。" },
      { cat: "👥 世代間ギャップ", topic: "タイパ重視のZ世代と昭和オジの温度差", memo: "倍速視聴と定時退社。合理的な若者にぐうの音も出ないオジの葛藤と、それでも残る泥臭さの価値。" },
      { cat: "🛠️ 現場と道具", topic: "AI時代の到来と、絶対に代替されない泥臭い手触り", memo: "画面の前のスマートな効率化と、現場で油にまみれる職人技。手離れの悪さにこそ宿る利益。" },
      { cat: "🏢 経営の修羅場", topic: "失敗という名の最強の教科書と、25年生き残った知恵", memo: "倒産危機、裏切り、痛い目を見た数々。教科書の経営論より、現場で流した冷や汗が人を育てる。" },
      { cat: "🌀 世間の違和感", topic: "綺麗事だらけの正論と、生活者のリアルな肌感", memo: "テレビの景気回復ニュースと、スーパーの特売卵。数字の上のお祭りと我々の暮らしの境界線。" },
      { cat: "☕ 中年の身体と日常", topic: "枯れゆく体力と、何にも代えがたい熟睡の快感", memo: "夜更かしができなくなったオジのリアル。美味しいご飯を腹いっぱい食べて泥のように眠る幸せ。" }
    ];

    let currentTone = 'oji';
    let currentTab = 'note';
    let contentStore = { note: "", x: "", instagram: "", facebook: "" };

    const urls = {
      note: "https://note.com",
      x: "https://twitter.com/intent/tweet?text=",
      instagram: "https://www.instagram.com/",
      facebook: "https://www.facebook.com/"
    };

    function init() {
      const key = localStorage.getItem("sgo_gemini_api_key");
      const keyBtn = document.getElementById("keyBtn");
      if (key) {
        keyBtn.className = "btn-header key-set";
        keyBtn.textContent = "⚙️ 設定 (設定済)";
      } else {
        keyBtn.className = "btn-header key-empty";
        keyBtn.textContent = "⚙️ キー未設定";
        openKeyModal();
      }
      updateHistoryBadge();
    }

    function selectTone(toneId, btn) {
      currentTone = toneId;
      document.querySelectorAll(".tone-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }

    function updateCounts() {
      document.getElementById("topicCount").textContent = `${document.getElementById("topicInput").value.length} 文字`;
      document.getElementById("detailsCount").textContent = `${document.getElementById("detailsInput").value.length} 文字`;
    }

    function handleTextChange() {
      const val = document.getElementById("resultText").value;
      contentStore[currentTab] = val;
      if (currentTab === "note") {
        document.getElementById("noteCharBadge").textContent = val.length;
      } else if (currentTab === "x") {
        document.getElementById("xCharBadge").textContent = val.length;
      }
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    function showError(msg) {
      const el = document.getElementById("errorCard");
      if (msg) {
        el.innerHTML = `⚠️ <strong>エラー:</strong> ${msg}`;
        el.style.display = "block";
      } else {
        el.style.display = "none";
      }
    }

    function openKeyModal() {
      document.getElementById("apiKeyInput").value = localStorage.getItem("sgo_gemini_api_key") || "";
      document.getElementById("keyModal").classList.add("open");
    }
    function closeKeyModal() {
      document.getElementById("keyModal").classList.remove("open");
    }
    function saveApiKey() {
      const val = document.getElementById("apiKeyInput").value.trim();
      if (!val) {
        alert("APIキーを入力してください。");
        return;
      }
      localStorage.setItem("sgo_gemini_api_key", val);
      showError("");
      closeKeyModal();
      init();
      showToast("✅ APIキーを保存しました");
    }

    /* お題提案・ガチャ機能 */
    function applyRandomPreset() {
      const random = PRESET_IDEAS[Math.floor(Math.random() * PRESET_IDEAS.length)];
      document.getElementById("topicInput").value = random.topic;
      document.getElementById("detailsInput").value = random.memo;
      updateCounts();
      showToast("🎲 ランダムお題をセットしました！");
    }

    async function suggestIdeasWithAI() {
      const apiKey = localStorage.getItem("sgo_gemini_api_key");
      if (!apiKey) {
        openKeyModal();
        return;
      }

      document.getElementById("ideasModal").classList.add("open");
      const listEl = document.getElementById("ideasList");
      listEl.innerHTML = `
        <div style="text-align:center;padding:40px 0;color:#94a3b8;">
          <div class="spinner" style="width:24px;height:24px;border-color:rgba(56,189,248,0.3);border-top-color:#38bdf8;margin-bottom:12px;"></div>
          <div style="font-size:0.85rem;">キレのあるお題をブレインストーミング中...</div>
        </div>
      `;

      try {
        const res = await fetch("/api/studio/suggest", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ apiKey })
        });
        const data = await res.json();
        renderIdeas(data.ideas || PRESET_IDEAS.slice(0, 5));
      } catch (e) {
        const shuffled = [...PRESET_IDEAS].sort(() => 0.5 - Math.random()).slice(0, 5);
        renderIdeas(shuffled);
      }
    }

    function renderIdeas(items) {
      const listEl = document.getElementById("ideasList");
      listEl.innerHTML = items.map((item, idx) => `
        <div style="background:#162032;border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.08);cursor:pointer;" onclick="selectIdea(${idx})">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <span style="font-size:0.88rem;font-weight:800;color:#f8fafc;">${item.topic}</span>
            <span style="font-size:0.68rem;background:rgba(56,189,248,0.15);color:#38bdf8;padding:2px 8px;border-radius:10px;font-weight:700;">${item.cat || "お題"}</span>
          </div>
          <p style="font-size:0.75rem;color:#94a3b8;line-height:1.4;margin:4px 0 0;">${item.memo}</p>
          <div style="font-size:0.7rem;color:#10b981;font-weight:700;margin-top:6px;text-align:right;">👉 このお題を使う</div>
        </div>
      `).join("");
      window._currentIdeas = items;
    }

    function selectIdea(idx) {
      const idea = window._currentIdeas?.[idx];
      if (!idea) return;
      document.getElementById("topicInput").value = idea.topic;
      document.getElementById("detailsInput").value = idea.memo;
      updateCounts();
      closeIdeasModal();
      showToast("💡 お題をセットしました！");
    }

    function closeIdeasModal() {
      document.getElementById("ideasModal").classList.remove("open");
    }

    /* エッセイ＆SNS一括生成 */
    async function generateContent() {
      const apiKey = localStorage.getItem("sgo_gemini_api_key");
      if (!apiKey) {
        openKeyModal();
        return;
      }

      const topic = document.getElementById("topicInput").value.trim();
      const details = document.getElementById("detailsInput").value.trim();
      if (!topic) {
        alert("お題やテーマを入力してください（「🎲 お題をAIに提案してもらう」も使えます）。");
        return;
      }

      showError("");
      const genBtn = document.getElementById("generateBtn");
      const btnIcon = document.getElementById("btnIcon");
      const btnText = document.getElementById("btnText");

      genBtn.disabled = true;
      btnIcon.innerHTML = `<span class="spinner"></span>`;
      btnText.textContent = "ゼロベース書き下ろし中 (1,500〜2,500字)...";

      try {
        const res = await fetch("/api/studio/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            apiKey,
            tone: currentTone,
            topic,
            details
          })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) {
          throw new Error(data.error || `通信エラー (${res.status})`);
        }

        const text = data.text || "";
        if (!text) throw new Error("生成結果が空でした。再度お試しください。");

        // 結果を画面に確実に反映
        displayResults(text, data.sns || {});
        showToast("✨ ゼロベース執筆が完了しました！");

        const historyItem = {
          id: Date.now().toString(),
          createdAt: new Date().toLocaleString("ja-JP"),
          topic,
          tone: currentTone,
          text,
          charCount: text.length,
          sns: data.sns || { x: "", instagram: "", facebook: "" }
        };
        saveHistory(historyItem);
      } catch (err) {
        console.error(err);
        showError(err.message || "予期せぬエラーが発生しました。");
      } finally {
        genBtn.disabled = false;
        btnIcon.textContent = "⚡";
        btnText.textContent = "完全ゼロベース執筆を開始";
      }
    }

    /* 生成結果の直接DOM反映 */
    function displayResults(essayText, sns) {
      contentStore.note = essayText || "";
      contentStore.x = sns?.x || "";
      contentStore.instagram = sns?.instagram || "";
      contentStore.facebook = sns?.facebook || "";

      currentTab = "note";

      document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
        if (idx === 0) btn.classList.add("active");
        else btn.classList.remove("active");
      });

      const resultBox = document.getElementById("resultText");
      resultBox.value = contentStore.note;
      resultBox.className = "result-box";

      document.getElementById("noteCharBadge").textContent = contentStore.note.length;
      document.getElementById("xCharBadge").textContent = contentStore.x.length;

      const openBtn = document.getElementById("openAppBtn");
      openBtn.href = "https://note.com";
      openBtn.innerHTML = "<span>🚀 NOTEを開く</span>";

      document.getElementById("resultCard").style.display = "block";
      document.getElementById("resultCard").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function switchTab(tab, btn) {
      // 現在のタブの内容を保存
      contentStore[currentTab] = document.getElementById("resultText").value;
      currentTab = tab;

      if (btn) {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      }

      const resultBox = document.getElementById("resultText");
      resultBox.value = contentStore[tab] || "";
      resultBox.className = tab === "note" ? "result-box" : "result-box sns-mode";

      document.getElementById("noteCharBadge").textContent = (contentStore.note || "").length;
      document.getElementById("xCharBadge").textContent = (contentStore.x || "").length;

      const openBtn = document.getElementById("openAppBtn");
      if (tab === "x") {
        openBtn.href = `${urls.x}${encodeURIComponent(contentStore.x || contentStore.note.slice(0, 100))}`;
      } else {
        openBtn.href = urls[tab];
      }
      openBtn.innerHTML = `<span>🚀 ${tab.toUpperCase()} を開く</span>`;
    }

    function copyCurrentTab() {
      const text = document.getElementById("resultText").value;
      if (!text) {
        alert("コピーする文章がありません。");
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("copyBtn");
        btn.classList.add("copied");
        btn.innerHTML = `<span>✅ コピー完了！</span>`;
        showToast("📋 クリップボードにコピーしました！");
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.innerHTML = `<span>📋 本文をコピー</span>`;
        }, 2000);
      });
    }

    /* 履歴管理 */
    function getHistories() {
      try { return JSON.parse(localStorage.getItem("sgo_studio_history") || "[]"); } catch { return []; }
    }
    function saveHistory(item) {
      const list = [item, ...getHistories().filter(h => h.id !== item.id)].slice(0, 40);
      localStorage.setItem("sgo_studio_history", JSON.stringify(list));
      updateHistoryBadge();
    }
    function updateHistorySns(id, sns) {
      const list = getHistories().map(h => h.id === id ? { ...h, sns } : h);
      localStorage.setItem("sgo_studio_history", JSON.stringify(list));
    }
    function updateHistoryBadge() {
      document.getElementById("historyCount").textContent = getHistories().length;
    }
    function openHistory() {
      const list = getHistories();
      const container = document.getElementById("historyList");
      if (list.length === 0) {
        container.innerHTML = `<div style="text-align:center;color:#64748b;padding:40px 0;">履歴はありません</div>`;
      } else {
        container.innerHTML = list.map(item => `
          <div style="background:#162032;border-radius:12px;padding:12px;border:1px solid var(--border);cursor:pointer;" onclick="loadHistory('${item.id}')">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
              <span style="font-size:0.85rem;font-weight:700;color:#38bdf8;">${item.topic}</span>
              <button onclick="event.stopPropagation();deleteHistory('${item.id}')" style="background:transparent;border:none;color:#ef4444;cursor:pointer;">🗑️</button>
            </div>
            <div style="font-size:0.72rem;color:#94a3b8;display:flex;justify-content:space-between;">
              <span>${item.tone}</span>
              <span>${item.charCount} 字 / ${item.createdAt}</span>
            </div>
          </div>
        `).join("");
      }
      document.getElementById("historyDrawer").classList.add("open");
    }
    function closeHistory() {
      document.getElementById("historyDrawer").classList.remove("open");
    }
    function loadHistory(id) {
      const item = getHistories().find(h => h.id === id);
      if (!item) return;
      document.getElementById("topicInput").value = item.topic;
      displayResults(item.text, item.sns || {});
      closeHistory();
      showToast("📂 履歴から読み込みました");
    }
    function deleteHistory(id) {
      const list = getHistories().filter(h => h.id !== id);
      localStorage.setItem("sgo_studio_history", JSON.stringify(list));
      openHistory();
      updateHistoryBadge();
    }

    // 起動
    init();
  </script>
</body>
</html>
