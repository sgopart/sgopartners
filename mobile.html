<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SGO Mobile Studio | オジ文体note ＆ SNSマルチ作成</title>
  <style>
    :root {
      --bg: #0b1320;
      --card-bg: #142033;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-oji: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); color: var(--text); padding: 12px; min-height: 100vh; overflow-x: hidden; }
    
    header { text-align: center; margin-bottom: 12px; padding-top: 4px; }
    header h1 { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; }
    header p { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    
    .quick-tags { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
    .tag-btn { white-space: nowrap; padding: 7px 14px; border-radius: 16px; border: 1px solid var(--border); background: #1a2942; color: #e2e8f0; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .tag-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .tag-btn.oji { border-color: rgba(245, 158, 11, 0.4); color: #fbbf24; }
    .tag-btn.oji.active { background: #d97706; color: #fff; }

    .input-card { background: var(--card-bg); border-radius: 14px; padding: 12px; border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(0,0,0,0.25); margin-bottom: 12px; }
    .textarea-wrapper { position: relative; }
    textarea { width: 100%; height: 95px; background: #0c1421; border: 1px solid var(--border); border-radius: 10px; color: #fff; padding: 10px; font-size: 0.95rem; line-height: 1.45; resize: none; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: #3b82f6; }
    
    .input-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .char-count { font-size: 0.75rem; color: var(--text-muted); }
    
    .btn-send { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
    .btn-send:active { transform: scale(0.97); }

    /* タブ切り替えバー */
    .tab-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
    .tab-btn { flex: 1; min-width: 65px; padding: 8px 2px; border: none; border-radius: 8px; background: #1a2a44; color: var(--text-muted); font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; }
    .tab-btn.active { background: #2563eb; color: #fff; }

    .result-section { display: flex; flex-direction: column; }
    .result-card { background: var(--card-bg); border-radius: 14px; padding: 14px; border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(0,0,0,0.25); display: flex; flex-direction: column; }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .result-title { font-size: 0.85rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    
    .result-body { background: #0c1421; border-radius: 10px; padding: 12px; color: #f1f5f9; font-size: 0.9rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word; overflow-y: auto; max-height: 420px; border: 1px solid var(--border); }
    
    .action-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .btn-action { padding: 11px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; text-decoration: none; text-align: center; }
    .btn-copy { background: #2563eb; color: #fff; }
    .btn-copy.copied { background: #10b981; }
    .btn-open { background: #334155; color: #f8fafc; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #10b981; color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 0.85rem; font-weight: 700; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <header>
    <h1>🚀 SGO Mobile Studio</h1>
    <p>音声入力でお題を話す ➔ 瞬時にオジ文体エッセイ＆SNS一括生成</p>
  </header>

  <!-- クイックテンプレート -->
  <div class="quick-tags">
    <button class="tag-btn oji active" onclick="setMode('oji', event)">✍️ オジ文体note</button>
    <button class="tag-btn" onclick="setMode('sns', event)">📱 4大SNSマルチ展開</button>
    <button class="tag-btn" onclick="setMode('decompose', event)">🔄 noteをSNS告知化</button>
  </div>

  <!-- 入力カード -->
  <div class="input-card">
    <div class="textarea-wrapper">
      <textarea id="promptInput" placeholder="お題や気になることを入力（例: 新入社員の挨拶、リモートワークの罠、値上げ、洗車の現場）..."></textarea>
    </div>
    <div class="input-footer">
      <span id="charCount" class="char-count">0 文字</span>
      <button id="sendBtn" class="btn-send" onclick="generateContent()">
        <span>🚀 瞬時に作成</span>
      </button>
    </div>
  </div>

  <!-- 結果カード -->
  <div class="result-section" id="resultSection">
    <div class="result-card">
      <div class="result-header">
        <span id="resultTitle" class="result-title">✨ 生成結果プレビュー</span>
        <span id="charLengthBadge" style="font-size: 0.75rem; color: #94a3b8;">0 文字</span>
      </div>

      <!-- SNSモード時のプラットフォームタブ -->
      <div id="snsTabBar" class="tab-bar" style="display: none;">
        <button class="tab-btn active" onclick="switchSNSTab('x', event)">🐦 X</button>
        <button class="tab-btn" onclick="switchSNSTab('instagram', event)">📸 Instagram</button>
        <button class="tab-btn" onclick="switchSNSTab('facebook', event)">👥 Facebook</button>
        <button class="tab-btn" onclick="switchSNSTab('note', event)">📝 note</button>
      </div>

      <div id="resultBody" class="result-body">ここに生成結果が表示されます。
お題を音声入力してキーボードの「確定/Enter」または「🚀 瞬時に作成」を押してください。</div>

      <div class="action-bar">
        <button id="copyBtn" class="btn-action btn-copy" onclick="copyResult()">
          <span>📋 全文コピー</span>
        </button>
        <a id="openAppBtn" class="btn-action btn-open" href="https://note.com" target="_blank" rel="noopener">
          <span>📝 noteを開く</span>
        </a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">クリップボードにコピーしました！</div>

  <script>
    let currentMode = 'oji';
    let currentSNSTab = 'x';
    let generatedData = {
      oji: "",
      x: "",
      instagram: "",
      facebook: "",
      note: ""
    };

    function setMode(mode, e) {
      if (e) e.preventDefault();
      currentMode = mode;
      document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
      if (e && e.target) e.target.classList.add('active');

      const input = document.getElementById('promptInput');
      const tabBar = document.getElementById('snsTabBar');
      const openBtn = document.getElementById('openAppBtn');

      if (mode === 'oji') {
        tabBar.style.display = 'none';
        input.placeholder = "noteのお題を入力（例: 新入社員の挨拶、リモートワーク、値上げ、洗車の現場）...";
        openBtn.href = "https://note.com";
        openBtn.innerHTML = "<span>📝 noteを開く</span>";
      } else {
        tabBar.style.display = 'flex';
        input.placeholder = "SNSに投稿したい実績やトピックを入力（Enterで即時作成）...";
        updateSNSAppBtn();
      }
      updateCharCount();
    }

    const inputArea = document.getElementById('promptInput');
    inputArea.addEventListener('input', updateCharCount);

    // Enterキーで画面スクロールさせず即座に実行
    inputArea.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generateContent();
      }
    });

    function updateCharCount() {
      document.getElementById('charCount').textContent = `${inputArea.value.length} 文字`;
    }

    // ==========================================
    // オジ文体・インテリジェント生成ロジック（鈴木啓悟様原本モデル）
    // ==========================================
    function extractTitleKeyword(topic) {
      const t = topic.trim();
      const m = t.match(/【(.*?)】/);
      if (m) return m[1];
      if (t.length <= 6) return t;

      const mapping = [
        [/(新入社員|若者|世代|新人|Z世代)/, '温度差'],
        [/(リモート|在宅|出社|オフィス|zoom)/, '距離感'],
        [/(AI|ChatGPT|Claude|ツール|自動化)/, '道具と人間'],
        [/(値上げ|コスト|インフレ|価格|お金|給料|株価)/, '実体経済'],
        [/(洗車|車|現場|職人|設備|建築)/, '泥臭さ'],
        [/(人間関係|コミュニケーション|挨拶|本音|建前)/, '境界線'],
        [/(タイパ|コスパ|効率|時短|倍速)/, '倍速の世界'],
        [/(失敗|挫折|倒産|赤字|借金)/, '最強の教科書'],
        [/(経営|独立|起業|事業|リーダー|社長)/, '覚悟の重さ'],
        [/(SNS|X|Twitter|インスタ|バズ)/, '承認と虚栄'],
        [/(健康|睡眠|老い|中年|体力|体調|胃)/, '枯れゆく身体'],
        [/(横浜|桜木町|街|地元|地域)/, '街の記憶'],
        [/(搾取|下請け|不条理)/, '不条理の構造']
      ];

      for (let [re, title] of mapping) {
        if (re.test(t)) return title;
      }
      return t.length <= 6 ? t : '違和感';
    }

    function buildDynamicOjiEssay(rawTopic) {
      const topic = rawTopic.trim().replace(/^【(.*?)】$/, '$1');
      const title = extractTitleKeyword(topic);

      return `【${title}】

■${topic}にまつわる、ふとした違和感

連日、様々なニュースや世間のトレンドが猛スピードで流れていく。
街を歩いていても、打ち合わせの席に座っていても、ふとした瞬間に立ち止まるオジ(おじ)がいる。

お題は、まさに「${topic}」についてだ。

世間ではスマートな正論や効率的なノウハウが飛び交っているけれど、実際に現場で汗を流していると、どうしても言葉にできないザラつきのようなものが胸に残る。

理由はざっくり3つ。

1. 時代の変化スピードが早すぎて、オジ(おじ)の脳内OSのアップデートがまるで追いついていない（自虐()）。
2. 若い世代やデジタルの合理性は100%正しいのに、なんとなく過去の泥臭いやり方に未練を残してしまう（反省()）。
3. そして、「${topic}」の背後にある本音や格差💸を、みんな見て見ぬふりをしながら毎日を必死に生き抜いているということ。

つまりこれは「誰が正しい」「誰が間違っている」という話ではなく(みんな薄々知ってる)、時代の移り変わりと構造の変化が生んだ、ごく自然なグラデーションに過ぎない。らしい。

■オジ(おじ)の立ち位置と配慮

一応、あります。私なりの配慮と大人の分別が。

会社経営を25年やってきて、建築の現場から音楽マネジメント、事業支援まで色々と見てきた。
痛い目も山ほど見たし、失敗という名の最強の教科書も死ぬほど読んできた。✍️

だからこそ、若い世代の邪魔はしたくない。
聞かれてもないのに「昔はこうだった」「俺たちの若い頃は」なんて語り出すオジ(おじ)には絶対に成り下がりたくない（カッコつけ()）。

でも、困ったときに後ろからそっと手を差し伸べられるくらいの余白は持っておきたい。
…持たざるものは?💸
…持たざるものの知恵、か。

■デメリットと実体経済

こちらの方が切実。

意固地になることのダメージは、地味に切実だ。
「${topic}」に向き合えず、過去のやり方やすがれる何かに固執した人間から、静かに時代の外側へ追いやられていく。
これはもう完全に歴史が証明している。私はそう思っている。

一度上がった物価や変化のスピードは、もう元には戻らないよ。
下がった歴史がない。私は知らない。

株や資産を持っている人はどんどん豊かになる一方、日々の現場で踏ん張っている人たちにその恩恵が届くのはいつになるのか。いわゆる格差は静かに、しかし確実に広がっていく。いまもね。🌀

______

現実問題、様々な現場で影響出てます。
デカすぎ。これからはもっと出てくる。

だって世の中の仕組みが複雑すぎて、お上も把握しきれてないし(きっとそう)、誰が正確に把握してるのかな?私が無知なだけか。

とにかく、数字や建前と、我々の暮らしの肌感は今や完全に別の話になってしまっています。
疑問だから初めてこういう趣旨の投稿をした。

現実問題、世の中はどんどんスマートに、タイパ重視で進んでいきます。
でも、最後に人を動かすのは、やっぱり計算できない泥臭さと、不器用な情熱だったりするんだよね。

だから今出来る事を黙々とやるよ、
自分のペースで、一歩ずつ前に進むだけ。
熟睡したいぜ。いつもご飯腹いっぱい食べたい。

皆さんよい週末を。`;
    }

    async function generateContent() {
      inputArea.blur();
      const rawTopic = inputArea.value.trim() || "日常の気づきとビジネスの違和感";

      // 1. オジ文体動的生成
      const ojiText = buildDynamicOjiEssay(rawTopic);

      // 2. SNSマルチ展開テキスト動的生成
      const xPost = `【事業支援・新着トピック】
${rawTopic}

横浜・桜木町を拠点に、中小企業・スタートアップの現場に入り込む実働型事業支援パートナー。
課題解決から次の成長の一手まで一貫伴走します。

詳細はこちら👇
https://sgopartners.com
#SGOPartners #事業支援 #横浜 #経営パートナー`;

      const igPost = `✨ ${rawTopic} ✨

私たちが目指すのは、ただのアドバイスにとどまらない「現場伴走型の事業支援」。
経営課題の抽出から、事業計画・ブランディング・Web実装まで一気通貫でサポートします。

━━━━━━━━━━━━━━━
📍 SGO Partners
拠点：横浜・桜木町（クロスゲート7F）
対応エリア：神奈川・東京・全国オンライン
━━━━━━━━━━━━━━━

プロフィールのリンクから無料相談を受付中🔗
@sgopartners_official

.
#SGOPartners #事業コンサルティング #経営戦略 #中小企業支援 #スタートアップ支援 #横浜ビジネス #桜木町 #神奈川 #Web集客 #DX推進 #事業成長 #起業家支援 #ビジネスパートナー #伴走支援 #経営革新 #戦略支援`;

      const fbPost = `【SGO Partners 最新の取り組みと事業報告】

『${rawTopic}』

平素よりSGO Partnersをご愛顧いただき誠にありがとうございます。
私たちは横浜・桜木町を拠点に、神奈川および東京の中小企業・スタートアップ企業様向けに伴走型事業支援を展開しております。

昨今のビジネス環境において、単なる部分最適ではなく、事業戦略・財務計画・マーケティング・ITシステム実装までをシームレスに統合した伴走支援が求められています。

弊社では今後も、経営者様と同じ目線で課題解決と持続的成長の実現にコミットしてまいります。

▼ 詳しい支援実績・無料経営相談はこちら
https://sgopartners.com`;

      generatedData = {
        oji: ojiText,
        x: xPost,
        instagram: igPost,
        facebook: fbPost,
        note: ojiText
      };

      // バックエンド（mobile_bridge.py等）が存在する場合は非同期通信も試行
      try {
        fetch('/api/mobile_execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: currentMode, prompt: rawTopic })
        }).then(res => res.ok ? res.json() : null).then(json => {
          if (json && json.output) {
            if (currentMode === 'oji') {
              generatedData.oji = json.output;
              generatedData.note = json.output;
            }
            renderResult();
          }
        }).catch(() => {});
      } catch (e) {}

      renderResult();
      document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function switchSNSTab(tab, e) {
      if (e) e.preventDefault();
      currentSNSTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (e && e.target) e.target.classList.add('active');
      updateSNSAppBtn();
      renderResult();
    }

    function updateSNSAppBtn() {
      const openBtn = document.getElementById('openAppBtn');
      const urls = {
        x: 'https://twitter.com/compose/tweet',
        instagram: 'https://www.instagram.com/',
        facebook: 'https://www.facebook.com/',
        note: 'https://note.com/'
      };
      openBtn.href = urls[currentSNSTab] || '#';
      openBtn.innerHTML = `<span>🚀 ${currentSNSTab.toUpperCase()} を開く</span>`;
    }

    function renderResult() {
      const body = document.getElementById('resultBody');
      const text = currentMode === 'oji' ? (generatedData.oji || "") : (generatedData[currentSNSTab] || "");
      body.textContent = text || "お題を入力して「🚀 瞬時に作成」を押してください。";
      document.getElementById('charLengthBadge').textContent = `${text.length} 文字`;
    }

    function copyResult() {
      const text = document.getElementById('resultBody').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.classList.add('copied');
        btn.innerHTML = '<span>✅ コピー完了！</span>';

        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = '<span>📋 全文コピー</span>';
          toast.classList.remove('show');
        }, 2000);
      });
    }
  </script>
</body>
</html>
