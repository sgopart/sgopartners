<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SGO Mobile Studio | クイックコピー＆SNS投稿</title>
  <style>
    :root {
      --bg: #0b1320;
      --card-bg: #142033;
      --primary: #2563eb;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); color: var(--text); padding: 14px; min-height: 100vh; }
    
    header { text-align: center; margin-bottom: 16px; padding-top: 6px; }
    header h1 { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; color: #fff; }
    header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    
    .tab-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
    .tab-btn { flex: 1; min-width: 70px; padding: 9px 4px; border: 1px solid var(--border); border-radius: 10px; background: #1a2a44; color: var(--text-muted); font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .card { background: var(--card-bg); border-radius: 14px; padding: 14px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 14px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-title { font-size: 0.88rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 6px; }
    .char-badge { font-size: 0.75rem; color: var(--text-muted); }

    textarea { width: 100%; height: 260px; background: #0c1421; border: 1px solid var(--border); border-radius: 10px; color: #fff; padding: 12px; font-size: 0.95rem; line-height: 1.6; resize: none; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: #3b82f6; }

    .action-bar { display: grid; grid-template-columns: 1.2fr 1fr; gap: 10px; margin-top: 12px; }
    .btn { padding: 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; text-align: center; }
    .btn-copy { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
    .btn-copy.copied { background: #10b981; }
    .btn-open { background: #1e293b; color: #f8fafc; border: 1px solid var(--border); }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #10b981; color: #fff; padding: 10px 24px; border-radius: 30px; font-size: 0.85rem; font-weight: 700; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <header>
    <h1>🚀 SGO Mobile Studio</h1>
    <p>AI生成テキストの確認・ワンタップコピー＆アプリ連携</p>
  </header>

  <!-- プラットフォーム切り替えタブ -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('note', event)">📝 note</button>
    <button class="tab-btn" onclick="switchTab('x', event)">🐦 X</button>
    <button class="tab-btn" onclick="switchTab('instagram', event)">📸 Instagram</button>
    <button class="tab-btn" onclick="switchTab('facebook', event)">👥 Facebook</button>
  </div>

  <div class="card">
    <div class="card-header">
      <span id="targetLabel" class="card-title">📝 note エッセイ本文</span>
      <span id="charCount" class="char-badge">0 文字</span>
    </div>

    <textarea id="contentBox" placeholder="ここに生成された文章を貼り付け、または編集して即時コピーできます..."></textarea>

    <div class="action-bar">
      <button id="copyBtn" class="btn btn-copy" onclick="copyContent()">
        <span>📋 全文コピー</span>
      </button>
      <a id="openAppBtn" class="btn btn-open" href="https://note.com" target="_blank" rel="noopener">
        <span>🚀 noteを開く</span>
      </a>
    </div>
  </div>

  <div id="toast" class="toast">クリップボードにコピーしました！</div>

  <script>
    let currentTab = 'note';
    const contents = {
      note: "",
      x: "",
      instagram: "",
      facebook: ""
    };

    const urls = {
      note: "https://note.com",
      x: "https://twitter.com/compose/tweet",
      instagram: "https://www.instagram.com/",
      facebook: "https://www.facebook.com/"
    };

    const labels = {
      note: "📝 note エッセイ本文",
      x: "🐦 X (Twitter) 投稿文",
      instagram: "📸 Instagram キャプション",
      facebook: "👥 Facebook 投稿文"
    };

    const textBox = document.getElementById('contentBox');
    textBox.addEventListener('input', () => {
      contents[currentTab] = textBox.value;
      updateBadge();
    });

    function switchTab(tab, e) {
      if (e) e.preventDefault();
      contents[currentTab] = textBox.value;
      currentTab = tab;

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (e && e.target) e.target.classList.add('active');

      document.getElementById('targetLabel').textContent = labels[tab];
      textBox.value = contents[tab] || "";
      
      const openBtn = document.getElementById('openAppBtn');
      openBtn.href = urls[tab];
      openBtn.innerHTML = `<span>🚀 ${tab.toUpperCase()} を開く</span>`;

      updateBadge();
    }

    function updateBadge() {
      document.getElementById('charCount').textContent = `${textBox.value.length} 文字`;
    }

    function copyContent() {
      const text = textBox.value;
      if (!text) {
        alert("コピーする文章がありません。");
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.classList.add('copied');
        btn.innerHTML = '<span>✅ コピー完了！</span>';

        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = '<span>📋 全文コピー</span>';
          toast.classList.remove('show');
        }, 2000);
      });
    }

    // 初期化
    updateBadge();
  </script>
</body>
</html>
